<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinematic 3D Spider-Man Experience</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  
  <section class="hero-section">
    <div class="pill-badge">⚡ CINEMATIC MOTION ENGINE</div>
    <h1>WITH GREAT POWER COMES <span>CINEMATIC GLSL CODE</span></h1>
    <p>Scroll to trigger suit assembly particles, velocity speed-lines, and radial post-processing shockwaves.</p>
  </section>

  <section id="scroll-cinematic-container" class="scroll-scene-container">
    <canvas id="three-canvas"></canvas>
    
    <div class="hud-top-left">
      <span id="hud-status">PHASE 1: SUIT-UP PARTICLES (0%)</span>
    </div>
  </section>

  <section class="content-section">
    <h2>3D MULTIVERSE ARCHIVES COMPLETE</h2>
  </section>

  <script type="module" src="main.js"></script>
</body>
</html>
